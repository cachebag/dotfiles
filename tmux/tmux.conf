bind -n C-Left  previous-window
bind -n C-Right next-window
bind -n C-x  new-window
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D
set -g mouse on
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode    Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "wl-copy"
bind p run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"
set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-features ",xterm-kitty:RGB"
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#1d2021,fg=#a89984"
set -g status-left-length 30
set -g status-left "#[bg=#fe8019,fg=#1d2021,bold] #S #[bg=#1d2021,fg=#fe8019]#[default]"
set -g status-right-length 60
set -g status-right "#[fg=#3c3836]#[bg=#3c3836,fg=#a89984] %a %d %b #[fg=#504945]#[bg=#504945,fg=#ebdbb2] %H:%M #[default]"
set -g window-status-format "#[bg=#1d2021,fg=#928374] #I #W "
set -g window-status-current-format "#[bg=#1d2021,fg=#fabd2f]#[bg=#fabd2f,fg=#1d2021,bold] #I #W #[bg=#1d2021,fg=#fabd2f]#[default]"
set -g window-status-separator ""
set -g window-status-bell-style "fg=#fb4934,bold"
set -g window-status-activity-style "fg=#8ec07c"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#8ec07c"
set -g display-panes-colour "#7c6f64"
set -g display-panes-active-colour "#fe8019"
set -g message-style "bg=#3c3836,fg=#fabd2f,bold"
set -g message-command-style "bg=#3c3836,fg=#8ec07c"
set -g mode-style "bg=#d65d0e,fg=#ebdbb2,bold"
set -g clock-mode-colour "#fabd2f"
set -g clock-mode-style 24
