"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 500

format = """
$directory$git_branch$git_status$rust$nodejs$python$golang$lua$c$cmd_duration
$character"""

[directory]
style = "bold {color7}"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " "
read_only_style = "{color1}"

[git_branch]
symbol = " "
style = "{color3}"
format = "[$symbol$branch]($style) "

[git_status]
style = "{color1}"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡${{count}}"
behind = "⇣${{count}}"
diverged = "⇕⇡${{ahead_count}}⇣${{behind_count}}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[rust]
symbol = " "
style = "{color2}"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "{color2}"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "{color2}"
format = "[$symbol($virtualenv )]($style)"

[golang]
symbol = " "
style = "{color2}"
format = "[$symbol($version )]($style)"

[lua]
symbol = " "
style = "{color2}"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "{color2}"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
style = "{color8}"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold {color6})"
error_symbol = "[❯](bold {color1})"
vimcmd_symbol = "[❮](bold {color3})"
