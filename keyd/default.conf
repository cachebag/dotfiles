# keyd: make a Mac keyboard behave on Hyprland.
#
# Command (⌘)  -> Ctrl   : macOS app shortcuts (⌘C/V/X/Z/A/T/W/F/L/Space …)
#                          work natively in every app, no per-app binds.
# left Option  -> Super  : the Hyprland window-manager modifier. All the
#                          "SUPER + …" binds in hyprland/keybinds.lua fire
#                          from this key (workspaces, close, launcher, focus).
# right Option  stays Alt, real Control stays Control.
#
# Install: see keyd/README.md.

[ids]
*

[main]
leftmeta = leftcontrol
rightmeta = leftcontrol
leftalt = leftmeta
