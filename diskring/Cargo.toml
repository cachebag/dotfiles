[package]
name = "diskring"
version = "0.1.0"
edition = "2024"
description = "Disk usage scanner behind the Quickshell sunburst overlay"
license = "MIT"
authors = ["Akrm Al-Hakimi <akrm@cachebag.sh>"]

[dependencies]
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
