"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 500
format = """
[╭─](bright-black)$directory$git_branch$git_status$nodejs$python$golang$rust$java$docker_context$fill$cmd_duration$time
[╰─](bright-black)$character"""
[fill]
symbol = " "
[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[ $path]($style)[$read_only]($read_only_style) "
read_only = " "
read_only_style = "red"
[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "
[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = '\$'
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"
[python]
symbol = "🐍 "
style = "cyan"
format = "[$symbol($virtualenv )]($style)"
[golang]
symbol = "🐹 "
style = "cyan"
format = "[$symbol($version )]($style)"
[rust]
symbol = "🦀 "
style = "red"
format = "[$symbol($version )]($style)"
[java]
symbol = "☕ "
style = "red"
format = "[$symbol($version )]($style)"
[docker_context]
symbol = "🐳 "
style = "blue"
format = "[$symbol$context ]($style)"
[cmd_duration]
min_time = 2000
style = "yellow"
format = "[󱎫 $duration]($style) "
[time]
disabled = false
style = "bright-black"
time_format = "%H:%M"
format = "[$time]($style)"
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
