general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/alk9fh/wallpapers/wall.jpg
    reload_time = 1
    reload_cmd = cat ~/.config/hypr/current_wallpaper

    blur_passes = 3
    blur_size = 8

    brightness = 0.65
    vibrancy = 0.15
}

label {
    monitor =
    text = $TIME
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -40
    halign = center
    valign = center

    placeholder_text = Password...
    dots_center = true
}
