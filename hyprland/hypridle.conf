# MacBook: lock with the quickshell lock screen (Lock.qml). lock() is
# idempotent, so repeated calls are fine. No dpms off: untested on the M3
# Pro display driver, and the lid handles the screen anyway.
general {
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = qs ipc call lock lock && sleep 1
    ignore_dbus_inhibit = false
}

# Lock after 10 minutes idle.
listener {
    timeout = 600
    on-timeout = qs ipc call lock lock
}
