# ── Font ──────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Slightly looser line spacing reads better with the padding below.
modify_font cell_height 108%

# ── Window ────────────────────────────────────────────────────────────
# Was 0.45, which washed the text out against busy wallpapers. Hyprland
# already blurs behind the window (blur size 6, passes 3), so 0.80 keeps
# the translucent look while text stays crisp.
background_opacity 0.80

# kitty's own blur is left off -- Hyprland does it compositor-side.
background_blur 0

window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

# ── Cursor ────────────────────────────────────────────────────────────
cursor_shape                 beam
cursor_beam_thickness        1.8
cursor_blink_interval        0.5
cursor_stop_blinking_after   15.0

# Subtle animated smear as the cursor moves. kitty >= 0.36.
cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# ── Tabs ──────────────────────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2

# ── Colors ────────────────────────────────────────────────────────────
# current-theme.conf (Gruvbox Dark Hard) is the fallback; the pywal include
# below overrides it whenever a palette has been generated. Order matters --
# last include wins.
include current-theme.conf
include ~/.cache/wal/colors-kitty.conf
